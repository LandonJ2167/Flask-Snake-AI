{% extends "base.html" %}
{% block title %} Snake AI {% endblock %}

{% block content %}

<!-- Header -->
<div class="relative z-10 flex flex-col items-center text-center mt-6">
    <h1 class="text-6xl font-bold text-white mb-4 tracking-tight">
        Snake <span class="text-green-400">AI</span>
    </h1>
</div>

<!-- Game Canvas -->
<div class="relative z-10 flex flex-col items-center mt-10">
    <canvas id="c" class="border border-gray-700 rounded shadow-lg"></canvas>
    <p class="text-gray-400 mt-4">Arrow keys / WASD to move</p>
</div>

<script>
const GRID = 20;
const CELL = 25;
const SPEED = 120;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = GRID * CELL;
canvas.height = GRID * CELL;

// Directions
const UP = [0, -1];
const DOWN = [0, 1];
const LEFT = [-1, 0];
const RIGHT = [1, 0];

// Game state
let snake;
let direction;
let nextDirection;
let food;
let score;
let gameState;

// Reset game
function reset() {
    snake = [[10,10], [9,10], [8,10]];
    direction = RIGHT;
    nextDirection = RIGHT;
    score = 0;
    food = spawnFood();
}

// Spawn food
function spawnFood() {
    while (true) {
        let x = Math.floor(Math.random() * GRID);
        let y = Math.floor(Math.random() * GRID);

        let onSnake = snake.some(([sx, sy]) => sx === x && sy === y);
        if (!onSnake) return [x, y];
    }
}

// Update logic
function update() {
    direction = nextDirection;

    let head = snake[0];
    let newHead = [head[0] + direction[0], head[1] + direction[1]];

    // Wall collision
    if (
        newHead[0] < 0 || newHead[0] >= GRID ||
        newHead[1] < 0 || newHead[1] >= GRID
    ) {
        gameState = "dead";
        return;
    }

    // Self collision
    if (snake.some(([x,y]) => x === newHead[0] && y === newHead[1])) {
        gameState = "dead";
        return;
    }

    snake.unshift(newHead);

    // Eat food
    if (newHead[0] === food[0] && newHead[1] === food[1]) {
        score++;
        food = spawnFood();
    } else {
        snake.pop();
    }
}

// Draw everything
function draw() {
    // Background
    ctx.fillStyle = "#0a0c14";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid
    ctx.strokeStyle = "#1e2440";
    for (let i = 0; i <= GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
    }

    // Snake
    ctx.fillStyle = "#00dc82";
    snake.forEach(([x,y]) => {
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    });

    // Food
    ctx.fillStyle = "#ff4659";
    ctx.fillRect(food[0] * CELL, food[1] * CELL, CELL, CELL);

    // Overlay text
    if (gameState === "menu") {
        drawText("Press Space to Start");
    } else if (gameState === "dead") {
        drawText("Game Over - Press Space");
    }
}

// Text helper
function drawText(text) {
    ctx.fillStyle = "white";
    ctx.font = "20px Arial";
    ctx.textAlign = "center";
    ctx.fillText(text, canvas.width/2, canvas.height/2);
}

// Game loop
let lastTime = 0;

function gameLoop(time) {
    if (gameState === "playing") {
        if (time - lastTime > SPEED) {
            update();
            lastTime = time;
        }
    }

    draw();
    requestAnimationFrame(gameLoop);
}

// Controls
document.addEventListener("keydown", e => {
    const map = {
        ArrowUp: UP, KeyW: UP,
        ArrowDown: DOWN, KeyS: DOWN,
        ArrowLeft: LEFT, KeyA: LEFT,
        ArrowRight: RIGHT, KeyD: RIGHT
    };

    if (map[e.code]) {
        let newDir = map[e.code];

        if (
            newDir[0] !== -direction[0] ||
            newDir[1] !== -direction[1]
        ) {
            nextDirection = newDir;
        }
    }

    if (e.code === "Space") {
        if (gameState === "menu" || gameState === "dead") {
            reset();
            gameState = "playing";
        }
    }
});

// Start
reset();
gameState = "menu";
requestAnimationFrame(gameLoop);
</script>

{% endblock %}
