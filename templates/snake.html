{% extends "base.html" %}
{% block title %} Snake AI {% endblock %}

{% block content %}

<style>
@keyframes moveGrid {
    0% { background-position: 0 0; }
    100% { background-position: 40px 40px; }
}
.grid-bg {
    position: fixed;
    inset: 0;
    /*left: 256px; Add to exclude the navbar*/
    background-image:
        linear-gradient(rgba(74, 222, 128, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74, 222, 128, 0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: moveGrid 3s linear infinite;
    pointer-events: none;
    z-index: 0;
    
}
</style>

<div class="grid-bg"></div>

<div class="content flex flex-col items-center justify-center h-full text-center px-4">

    <h1 class="text-6xl font-bold text-white mb-6 tracking-tight">
        Snake <span class="text-green-400">AI</span>
    </h1>

    <div class="flex gap-4 flex-wrap justify-center">
        <a href="/snake" class="px-8 py-3 bg-green-400 text-gray-900 rounded font-semibold hover:bg-green-300 transition-colors">
            Play
        </a>
        <a href="/snake" class="px-8 py-3 border border-green-400 text-green-400 rounded font-semibold hover:bg-green-400 hover:text-gray-900 transition-colors">
            Make AI Play
        </a>
    </div>

</div>

{% endblock %}
