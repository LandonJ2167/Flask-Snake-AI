{% extends "base.html" %}
{% block title %} Snake AI {% endblock %}

{% block content %}

<style>
@keyframes moveGrid {
    0% { background-position: 0 0; }
    100% { background-position: 40px 40px; }
}
.grid-bg {
    position: fixed;
    inset: 0;
    /*left: 256px; Add to exclude the navbar*/
    background-image:
        linear-gradient(rgba(74, 222, 128, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74, 222, 128, 0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: moveGrid 3s linear infinite;
    pointer-events: none;
    z-index: 0;
    
}
</style>

<div class="grid-bg"></div>

<!-- Snake AI + Play & Make AI Play -->
<div class="content flex flex-col items-center justify-top h-full text-left px-4">

    <h1 class="text-6xl font-bold text-white mt-4 mb-4 tracking-tight">
        Snake <span class="text-green-400">AI</span>
    </h1>

    <div class="flex gap-4 flex-wrap justify-center">
        <a href="/snake" class="px-8 py-3 bg-green-400 text-gray-900 rounded font-semibold hover:bg-green-300 transition-colors">
            Play
        </a>
        <a href="/snake" class="px-8 py-3 border border-green-400 text-green-400 rounded font-semibold hover:bg-green-400 hover:text-gray-900 transition-colors">
            Make AI Play
        </a> <!-- Make this a on/off button to work better. -->
    </div>

</div>
<!-- Snake AI + Play & Make AI Play END -->

<!-- Snake Game Canvas -->
<canvas id="board" class="fixed z-10 border-2 border-green-800 pointer-events-none" style="top: 10rem; left: 55%; transform: translateX(-50%); width: 50vw; height: 60vh; background-color: black;"></canvas>

<!-- Javascript Logic -->
<script>

    let blockSize = 10;
    let total_row = 50; //total row number
    let total_col = 50; //total column number
    let board;
    let context;

    let snakeX = blockSize * 10;
    let snakeY = blockSize * 10;

    // Set the total number of rows and columns
    let speedX = 0;  //speed of snake in x coordinate.
    let speedY = 0;  //speed of snake in Y coordinate.

    let snakeBody = [];

    let foodX;
    let foodY;

    let gameOver = false;

    window.onload = function () {
        // Set board height and width
        board = document.getElementById("board");
        board.height = total_row * blockSize;
        board.width = total_col * blockSize;
        context = board.getContext("2d");

        placeFood();
        document.addEventListener("keyup", changeDirection);  //for movements
        // Set snake speed
        setInterval(update, 1000 / 10);
    }

    function update() {
        if (gameOver) {
            return;
        }

        // Background of a Game
        context.fillStyle = "green";
        context.fillRect(0, 0, board.width, board.height);

        // Draw grid
        context.strokeStyle = "rgba(255, 255, 255, 0.2)";
        context.lineWidth = 1;
        for (let i = 0; i <= total_col; i++) {
            context.beginPath();
            context.moveTo(i * blockSize, 0);
            context.lineTo(i * blockSize, board.height);
            context.stroke();
        }
        for (let i = 0; i <= total_row; i++) {
            context.beginPath();
            context.moveTo(0, i * blockSize);
            context.lineTo(board.width, i * blockSize);
            context.stroke();
        }

        // Set food color and position
        context.fillStyle = "yellow";
        context.fillRect(foodX, foodY, blockSize, blockSize);

        if (snakeX == foodX && snakeY == foodY) {
            snakeBody.push([foodX, foodY]);
            placeFood();
        }

        // body of snake will grow
        for (let i = snakeBody.length - 1; i > 0; i--) {
            // it will store previous part of snake to the current part
            snakeBody[i] = snakeBody[i - 1];
        }
        if (snakeBody.length) {
            snakeBody[0] = [snakeX, snakeY];
        }

        context.fillStyle = "gray";
        snakeX += speedX * blockSize; //updating Snake position in X coordinate.
        snakeY += speedY * blockSize;  //updating Snake position in Y coordinate.
        context.fillRect(snakeX, snakeY, blockSize, blockSize);
        for (let i = 0; i < snakeBody.length; i++) {
            context.fillRect(snakeBody[i][0], snakeBody[i][1], blockSize, blockSize);
        }

        if (snakeX < 0
            || snakeX > total_col * blockSize
            || snakeY < 0
            || snakeY > total_row * blockSize) {

            // Out of bound condition
            gameOver = true;
            alert("Game Over");
        }

        for (let i = 0; i < snakeBody.length; i++) {
            if (snakeX == snakeBody[i][0] && snakeY == snakeBody[i][1]) {

                // Snake eats own body
                gameOver = true;
                alert("Game Over");
            }
        }
    }

    // Movement of the Snake - We are using addEventListener
    function changeDirection(e) {
        if (e.code == "ArrowUp" && speedY != 1) {
            // If up arrow key pressed with this condition...
            // snake will not move in the opposite direction
            speedX = 0;
            speedY = -1;
        }
        else if (e.code == "ArrowDown" && speedY != -1) {
            //If down arrow key pressed
            speedX = 0;
            speedY = 1;
        }
        else if (e.code == "ArrowLeft" && speedX != 1) {
            //If left arrow key pressed
            speedX = -1;
            speedY = 0;
        }
        else if (e.code == "ArrowRight" && speedX != -1) {
            //If Right arrow key pressed
            speedX = 1;
            speedY = 0;
        }
    }

    // Randomly place food
    function placeFood() {

        // in x coordinates.
        foodX = Math.floor(Math.random() * total_col) * blockSize;

        //in y coordinates.
        foodY = Math.floor(Math.random() * total_row) * blockSize;
    }
</script>


{% endblock %}
