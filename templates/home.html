{% extends "base.html" %}
{% block title %} Home {% endblock %}
{% block content %}
<style>
@keyframes moveGrid {
    0% { background-position: 0 0; }
    100% { background-position: 40px 40px; }
}
.grid-bg {
    position: fixed;
    inset: 0;
    left: 256px;
    background-color: #020617;
    background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 20px 20px;
    animation: moveGrid 3s linear infinite;
    pointer-events: none;
    z-index: 0;
}
</style>

<div class="grid-bg"></div>

<div style="position: fixed; inset: 0; left: 256px; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: top; text-align: top; padding: 1rem;">
    <h1 style="font-size: 3.75rem; font-weight: 700; color: white; margin-bottom: 1.5rem; letter-spacing: -0.025em;">
        Home <span style="color: #4ade80;">Page</span>
    </h1>
</div>

{% endblock %}
